webdriver {
  autodownload = true
}

environments {

  default {
    # webdriver.base.url = "http://localhost:8080/VisorWeb/"
  }

  chrome {
    webdriver.driver = "chrome"
    
    webdriver.capabilities {
      browserName = "chrome"
      acceptInsecureCerts = true
      
      "goog:chromeOptions" {
        args = [
          #"--start-maximized",
          "--window-size=1920,1080",
          "--incognito",
          "--disable-gpu",
          "--disable-extensions"
          #"--headless=new"
        ]
      }
    }
  }

  edge {
    webdriver.driver = "edge"
    
    webdriver.capabilities {
      browserName = "MicrosoftEdge"
      acceptInsecureCerts = true
      
      "ms:edgeOptions" {
        args = [
          #"--headless=new",
          "--window-size=1920,1080",
          #"--start-maximized",
          "--inprivate",
          "--disable-gpu"
        ]
      }
    }
  }
}

serenity {
  project.name = "Visor Web"
  take.screenshots = BEFORE_AND_AFTER_EACH_STEP


}