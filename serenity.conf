webdriver {
  capabilities {
    acceptInsecureCerts = true
    
    # Configuración por defecto para Chrome
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--start-maximized", "--incognito", "--disable-gpu", "--disable-extensions"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "http://localhost:8080/VisorWeb/"
  }
  
  # Bloque exclusivo para cambiar a Chrome por consola
  chrome {
    webdriver.driver = "chrome"
    webdriver.capabilities {
      browserName = "chrome"
      "goog:chromeOptions" {
        args = ["--start-maximized", "--incognito", "--disable-gpu", "--disable-extensions"]
      }
    }
  }

  # Bloque exclusivo para cambiar a Edge por consola (Evita el error de casteo)
  edge {
    webdriver.driver = "edge"
    webdriver.capabilities {
      browserName = "edge"
      "ms:edgeOptions" {
        args = ["--start-maximized", "--inprivate", "--disable-gpu"]
      }
    }
  }
}

serenity {
  project.name = "Visor Web"
  take.screenshots = BEFORE_AND_AFTER_EACH_STEP
}
